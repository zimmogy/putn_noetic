map:
  resolution: 0.1
  map_x_l: -20.0
  map_x_u: 20.0
  map_y_l: -20.0
  map_y_u: 20.0

planning: 
  step_size: 0.4
  h_surf_car: 0.7

  w_fit_plane: 1.0
  w_flatness: 1000.0
  w_slope: 0.02
  w_sparsity: 0.2

  ratio_max: 0.85
  ratio_min: 0.40
  conv_thre: 0.1152

  radius_fit_plane: 1.0
  use_lesta_traversability: false
  lesta_putn_weight: 0.3
  lesta_weight: 0.7
  lesta_unknown_penalty: 0.0
  lesta_risk_threshold: 0.75
  lesta_probability_layer: "traversability/probability"
  lesta_binary_layer: "traversability/binary"
  
 
